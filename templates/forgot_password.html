<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - DRESS System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="login-container floating-card">
        <div class="login-illustration">
            <img src="{{ url_for('static', filename='images/login_logo.png') }}" alt="Login Illustration" />
        </div>
        <div class="login-header">
            <h1>Forgot Password</h1>
            <p>Enter your username to receive a reset code via email</p>
        </div>

        <div id="message-container"></div>

        <form id="forgot-password-form" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <button type="submit" class="login-btn" id="submit-btn">
                Send Reset Code
            </button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="/login" style="color: #2ca9e1; text-decoration: none; font-size: 14px;">
                Back to Login
            </a>
        </div>

        <div class="loading" id="loading">
            <p>Sending reset code...</p>
        </div>
    </div>

    <script>
        document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const submitBtn = document.getElementById('submit-btn');
            const loading = document.getElementById('loading');
            const messageContainer = document.getElementById('message-container');

            // Clear previous messages
            messageContainer.innerHTML = '';

            // Show loading state
            submitBtn.style.display = 'none';
            loading.classList.add('show');

            try {
                const response = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Show success message
                    messageContainer.innerHTML = `
                        <div class="success-message">
                            ${data.message || 'Reset code sent! Please check your email.'}
                        </div>
                    `;
                    
                    // Redirect to reset password page after a short delay
                    setTimeout(() => {
                        window.location.href = '/reset-password';
                    }, 2000);
                } else {
                    // Show error message
                    messageContainer.innerHTML = `
                        <div class="error-message">
                            ${data.error || 'Failed to send reset code. Please try again.'}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Forgot password error:', error);
                messageContainer.innerHTML = `
                    <div class="error-message">
                        Network error. Please try again.
                    </div>
                `;
            } finally {
                // Hide loading state
                submitBtn.style.display = 'block';
                loading.classList.remove('show');
            }
        });
    </script>
</body>
</html>
