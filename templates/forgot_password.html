<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - DRESS System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
</head>
<body class="login-body">
    <div id="toast-container" class="toast-container"></div>
    <div class="login-container floating-card">
        <div class="login-illustration">
            <img src="{{ url_for('static', filename='images/login_logo.png') }}" alt="Login Illustration" />
        </div>
        <div class="login-header">
            <h1>Forgot Password</h1>
            <p>Enter your username to receive a reset code via email</p>
        </div>

        <form id="forgot-password-form" class="login-form">
            <div class="form-group">
                <div id="username-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>
                <div id="email-group" style="display: none;">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address">
                </div>
            </div>

            <button type="submit" class="login-btn" id="submit-btn">
                Send Reset Code
            </button>
        </form>

        <div class="login-link-container" id="switch-container">
            <a href="#" id="switch-link" class="login-link" onclick="switchMode(); return false;">
                Forgot username? Use email instead
            </a>
        </div>
        
        <div id="verification-section" class="login-form verification-section hidden">
            <form id="code-verify-form">
                <div class="form-group">
                    <label for="verification-code">Reset Code</label>
                    <input type="text" id="verification-code" placeholder="Enter 6-digit code" maxlength="6">
                </div>
                <button type="submit" class="login-btn secondary-btn" id="verify-btn">
                    Continue to Reset Password
                </button>
            </form>
            <div class="login-link-container">
                <a href="#" id="request-new-code-link" class="login-link">
                    Request new code
                </a>
            </div>
        </div>
        <div class="login-link-container">
            <a href="/login" class="login-link">
                Back to Login
            </a>
        </div>

        <div class="loading" id="loading">
            <p>Sending reset code...</p>
        </div>
    </div>

    <script>
        let useEmail = false;
        let lastIdentifier = '';
        let lastRequestTs = 0;
        const REQUEST_COOLDOWN_MS = 60000;
        const forgotForm = document.getElementById('forgot-password-form');
        const switchContainer = document.getElementById('switch-container');

        function switchMode() {
            useEmail = !useEmail;
            const switchLink = document.getElementById('switch-link');
            const usernameGroup = document.getElementById('username-group');
            const emailGroup = document.getElementById('email-group');
            const usernameInput = document.getElementById('username');
            const emailInput = document.getElementById('email');
            
            if (useEmail) {
                // Switch to email mode
                usernameGroup.style.display = 'none';
                emailGroup.style.display = 'block';
                emailInput.required = true;
                usernameInput.required = false;
                usernameInput.value = '';
                switchLink.textContent = 'Forgot email? Use username instead';
                document.querySelector('.login-header p').textContent = 'Enter your email to receive a reset code via email';
            } else {
                // Switch to username mode
                usernameGroup.style.display = 'block';
                emailGroup.style.display = 'none';
                usernameInput.required = true;
                emailInput.required = false;
                emailInput.value = '';
                switchLink.textContent = 'Forgot username? Use email instead';
                document.querySelector('.login-header p').textContent = 'Enter your username to receive a reset code via email';
            }
        }

        document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const identifier = useEmail 
                ? document.getElementById('email').value.trim()
                : document.getElementById('username').value.trim();
            
            if (!identifier) {
                showToast(`Please enter ${useEmail ? 'your email' : 'your username'}.`, 'error');
                return;
            }
            
            const submitBtn = document.getElementById('submit-btn');
            const loading = document.getElementById('loading');

            // Show loading state
            submitBtn.style.display = 'none';
            loading.classList.add('show');

            try {
                const response = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: identifier,
                        use_email: useEmail
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Show success toast
                    showToast(data.message || 'Reset code sent! Please check your email.', 'success');
                    lastIdentifier = identifier;
                    lastRequestTs = Date.now();
                    resetRequestLinkTimer();
                    if (forgotForm) {
                        forgotForm.classList.add('hidden');
                    }
                    if (switchContainer) {
                        switchContainer.classList.add('hidden');
                    }
                    const verificationSection = document.getElementById('verification-section');
                    verificationSection.classList.remove('hidden');
                    document.getElementById('verification-code').focus();
                } else {
                    // Show error toast
                    showToast(data.error || 'Failed to send reset code. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Forgot password error:', error);
                showToast('Network error. Please try again.', 'error');
            } finally {
                // Hide loading state
                submitBtn.style.display = 'block';
                loading.classList.remove('show');
            }
        });

        document.getElementById('code-verify-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const codeInput = document.getElementById('verification-code');
            codeInput.value = codeInput.value.replace(/[^0-9]/g, '').slice(0, 6);
            const code = codeInput.value;

            if (!lastIdentifier) {
                showToast('Please request a reset code first.', 'error');
                return;
            }

            if (code.length !== 6) {
                showToast('Enter the 6-digit code sent to your email.', 'error');
                return;
            }

            const encodedIdentifier = encodeURIComponent(lastIdentifier);
            const encodedCode = encodeURIComponent(code);
            window.location.href = `/reset-password?username=${encodedIdentifier}&code=${encodedCode}`;
        });
        
        function updateRequestLinkState() {
            const link = document.getElementById('request-new-code-link');
            if (!link) return;
            const remaining = Math.max(0, REQUEST_COOLDOWN_MS - (Date.now() - lastRequestTs));
            if (remaining === 0) {
                link.classList.remove('disabled');
                link.textContent = 'Request new code';
            } else {
                link.classList.add('disabled');
                link.textContent = `Request new code (${Math.ceil(remaining / 1000)}s)`;
            }
        }

        function resetRequestLinkTimer() {
            updateRequestLinkState();
            if (REQUEST_COOLDOWN_MS <= 0) return;
            const interval = setInterval(() => {
                updateRequestLinkState();
                if (Date.now() - lastRequestTs >= REQUEST_COOLDOWN_MS) {
                    clearInterval(interval);
                }
            }, 1000);
        }

        document.getElementById('request-new-code-link').addEventListener('click', async (e) => {
            e.preventDefault();
            updateRequestLinkState();
            const remaining = Math.max(0, REQUEST_COOLDOWN_MS - (Date.now() - lastRequestTs));
            if (remaining > 0) {
                showToast(`Please wait ${Math.ceil(remaining / 1000)}s before requesting again.`, 'warning');
                return;
            }

            if (!lastIdentifier) {
                showToast('Please enter your username or email first.', 'error');
                return;
            }
            
            const link = e.currentTarget;
            const originalText = link.textContent;
            link.style.pointerEvents = 'none';
            link.style.opacity = '0.6';
            link.textContent = 'Sending...';
            
            try {
                const response = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: lastIdentifier,
                        use_email: useEmail
                    })
                });
                const data = await response.json();
                
                if (data.success) {
                    showToast('A new reset code has been sent to your email.', 'success');
                    lastRequestTs = Date.now();
                    resetRequestLinkTimer();
                } else {
                    showToast(data.error || 'Failed to send a new code.', 'error');
                }
            } catch (error) {
                console.error('Request new code error:', error);
                showToast('Network error. Please try again.', 'error');
            } finally {
                link.style.pointerEvents = 'auto';
                link.style.opacity = '1';
                link.textContent = originalText;
                updateRequestLinkState();
            }
        });

        // Initialize link state
        updateRequestLinkState();
    </script>
</body>
</html>
