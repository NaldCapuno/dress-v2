<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - DRESS System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
</head>
<body class="login-body">
    <div id="toast-container" class="toast-container"></div>
    <div class="login-container floating-card">
        <div class="login-illustration">
            <img src="{{ url_for('static', filename='images/login_logo.png') }}" alt="Login Illustration" />
        </div>
        <div class="login-header">
            <h1>Admin Login</h1>
            <p>Enter valid username & password to continue</p>
        </div>

        <form id="login-form" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="login-btn" id="login-btn">
                Login
            </button>
        </form>

        <div class="login-link-container">
            <a href="/forgot-password" class="login-link">
                Forgot Password?
            </a>
        </div>

        <div class="loading" id="loading">
            <p>Authenticating...</p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const loginBtn = document.getElementById('login-btn');
            const loading = document.getElementById('loading');

            // Show loading state
            loginBtn.style.display = 'none';
            loading.classList.add('show');

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Determine role and dashboard name
                    const role = (data.admin && data.admin.role || '').toLowerCase();
                    let dashboardName = 'dashboard';
                    
                    if (role === 'security') {
                        dashboardName = 'security dashboard';
                    } else if (role === 'osas') {
                        dashboardName = 'OSAS dashboard';
                    } else if (role === 'guidance') {
                        dashboardName = 'guidance dashboard';
                    } else if (role === 'dean') {
                        dashboardName = 'dean dashboard';
                    }
                    
                    // Show success toast
                    showToast(`Login successful! Redirecting to ${dashboardName}...`, 'success');
                    
                    // Redirect based on role after a short delay
                    setTimeout(() => {
                        if (role === 'security') {
                            window.location.href = '/';
                        } else if (role === 'osas') {
                            window.location.href = '/osas';
                        } else if (role === 'guidance') {
                            window.location.href = '/guidance';
                        } else if (role === 'dean') {
                            window.location.href = '/dean';
                        } else {
                            window.location.href = '/';
                        }
                    }, 1500);
                } else {
                    // Show error toast
                    showToast(data.error || 'Login failed. Please check your credentials.', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showToast('Network error. Please try again.', 'error');
            } finally {
                // Hide loading state
                loginBtn.style.display = 'block';
                loading.classList.remove('show');
            }
        });
    </script>
</body>
</html>
