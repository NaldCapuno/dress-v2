<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - DRESS System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
</head>
<body class="login-body">
    <div id="toast-container" class="toast-container"></div>
    <div class="login-container floating-card">
        <div class="login-illustration">
            <img src="{{ url_for('static', filename='images/login_logo.png') }}" alt="Login Illustration" />
        </div>
        <div class="login-header">
            <h1>Reset Password</h1>
            <p>Enter your reset code and new password</p>
        </div>

        <form id="reset-password-form" class="login-form">
            <input type="hidden" id="username" name="username">
            
            <div class="form-group">
                <label for="reset_code">Reset Code</label>
                <input type="text" id="reset_code" name="reset_code" placeholder="Enter 6-digit code" maxlength="6" required>
                <small class="form-help-text">
                    Check your email for the reset code
                </small>
            </div>

            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" minlength="6" required>
                <small class="form-help-text">
                    Password must be at least 6 characters long
                </small>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>
            </div>

            <button type="submit" class="login-btn" id="submit-btn">
                Reset Password
            </button>
        </form>

        <div class="login-link-container">
            <a href="#" id="request-new-code-link" class="login-link">
                Request New Code
            </a>
            <span class="login-link-separator">|</span>
            <a href="/login" class="login-link">
                Back to Login
            </a>
        </div>

        <div class="loading" id="loading">
            <p>Resetting password...</p>
        </div>
    </div>

    <script>
        // Get username from URL parameter and store it
        const urlParams = new URLSearchParams(window.location.search);
        const usernameFromUrl = urlParams.get('username');
        const usernameInput = document.getElementById('username');
        
        if (usernameFromUrl) {
            usernameInput.value = decodeURIComponent(usernameFromUrl);
        } else {
            // If no username in URL, show error and redirect to forgot password
            showToast('Please request a reset code first.', 'error');
            setTimeout(() => {
                window.location.href = '/forgot-password';
            }, 2000);
        }
        
        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const resetCode = document.getElementById('reset_code').value;
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const submitBtn = document.getElementById('submit-btn');
            const loading = document.getElementById('loading');

            // Validate passwords match
            if (newPassword !== confirmPassword) {
                showToast('Passwords do not match. Please try again.', 'error');
                return;
            }

            // Validate password length
            if (newPassword.length < 6) {
                showToast('Password must be at least 6 characters long.', 'error');
                return;
            }

            // Show loading state
            submitBtn.style.display = 'none';
            loading.classList.add('show');

            try {
                const response = await fetch('/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        reset_code: resetCode,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Show success toast
                    showToast(data.message || 'Password reset successfully! Redirecting to login...', 'success');
                    
                    // Redirect to login page after a short delay
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    // Show error toast
                    showToast(data.error || 'Failed to reset password. Please check your reset code and try again.', 'error');
                }
            } catch (error) {
                console.error('Reset password error:', error);
                showToast('Network error. Please try again.', 'error');
            } finally {
                // Hide loading state
                submitBtn.style.display = 'block';
                loading.classList.remove('show');
            }
        });

        // Format reset code input (only numbers, max 6 digits)
        document.getElementById('reset_code').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
        });

        // Handle "Request New Code" link
        document.getElementById('request-new-code-link').addEventListener('click', async (e) => {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            
            if (!username) {
                showToast('Username not found. Please request a reset code from the forgot password page.', 'error');
                setTimeout(() => {
                    window.location.href = '/forgot-password';
                }, 2000);
                return;
            }

            // Disable the link temporarily to prevent multiple clicks
            const link = document.getElementById('request-new-code-link');
            const originalText = link.textContent;
            link.style.pointerEvents = 'none';
            link.style.opacity = '0.6';
            link.textContent = 'Sending...';

            try {
                const response = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showToast('A new reset code has been sent to your email address.', 'success');
                } else {
                    showToast(data.error || 'Failed to send new code. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Request new code error:', error);
                showToast('Network error. Please try again.', 'error');
            } finally {
                // Re-enable the link
                link.style.pointerEvents = 'auto';
                link.style.opacity = '1';
                link.textContent = originalText;
            }
        });
    </script>
</body>
</html>
