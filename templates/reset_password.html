<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - DRESS System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="login-container floating-card">
        <div class="login-illustration">
            <img src="{{ url_for('static', filename='images/login_logo.png') }}" alt="Login Illustration" />
        </div>
        <div class="login-header">
            <h1>Reset Password</h1>
            <p>Enter your username, reset code, and new password</p>
        </div>

        <div id="message-container"></div>

        <form id="reset-password-form" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="reset_code">Reset Code</label>
                <input type="text" id="reset_code" name="reset_code" placeholder="Enter 6-digit code" maxlength="6" required>
                <small style="color: #6b7280; font-size: 12px; display: block; margin-top: 5px;">
                    Check your email for the reset code
                </small>
            </div>

            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" minlength="6" required>
                <small style="color: #6b7280; font-size: 12px; display: block; margin-top: 5px;">
                    Password must be at least 6 characters long
                </small>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>
            </div>

            <button type="submit" class="login-btn" id="submit-btn">
                Reset Password
            </button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="/forgot-password" style="color: #2ca9e1; text-decoration: none; font-size: 14px;">
                Request New Code
            </a>
            <span style="color: #9ca3af; margin: 0 10px;">|</span>
            <a href="/login" style="color: #2ca9e1; text-decoration: none; font-size: 14px;">
                Back to Login
            </a>
        </div>

        <div class="loading" id="loading">
            <p>Resetting password...</p>
        </div>
    </div>

    <script>
        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const resetCode = document.getElementById('reset_code').value;
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const submitBtn = document.getElementById('submit-btn');
            const loading = document.getElementById('loading');
            const messageContainer = document.getElementById('message-container');

            // Clear previous messages
            messageContainer.innerHTML = '';

            // Validate passwords match
            if (newPassword !== confirmPassword) {
                messageContainer.innerHTML = `
                    <div class="error-message">
                        Passwords do not match. Please try again.
                    </div>
                `;
                return;
            }

            // Validate password length
            if (newPassword.length < 6) {
                messageContainer.innerHTML = `
                    <div class="error-message">
                        Password must be at least 6 characters long.
                    </div>
                `;
                return;
            }

            // Show loading state
            submitBtn.style.display = 'none';
            loading.classList.add('show');

            try {
                const response = await fetch('/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        reset_code: resetCode,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Show success message
                    messageContainer.innerHTML = `
                        <div class="success-message">
                            ${data.message || 'Password reset successfully! Redirecting to login...'}
                        </div>
                    `;
                    
                    // Redirect to login page after a short delay
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    // Show error message
                    messageContainer.innerHTML = `
                        <div class="error-message">
                            ${data.error || 'Failed to reset password. Please check your reset code and try again.'}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Reset password error:', error);
                messageContainer.innerHTML = `
                    <div class="error-message">
                        Network error. Please try again.
                    </div>
                `;
            } finally {
                // Hide loading state
                submitBtn.style.display = 'block';
                loading.classList.remove('show');
            }
        });

        // Format reset code input (only numbers, max 6 digits)
        document.getElementById('reset_code').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
        });
    </script>
</body>
</html>
